name: SP modern core build

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: sp-modern-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build final playable demo
        shell: cmd
        run: build_sp.cmd
      - name: Preserve generated release source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SPVersion-generated-source
          path: build-sp/demo_d3d11_human_release.cpp
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload packaged demo
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SPVersion-demo
          path: dist/SPVersion-demo.zip
