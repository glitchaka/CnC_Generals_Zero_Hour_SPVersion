name: SP modern core build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S SPBuild -B build-sp -A Win32
      - name: Build
        run: cmake --build build-sp --config Release --parallel
      - name: Test
        run: ctest --test-dir build-sp -C Release --output-on-failure
