name: SP modern core build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build final playable demo
        shell: cmd
        run: build_sp.cmd
      - name: Upload packaged demo
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SPVersion-demo
          path: dist/SPVersion-demo.zip
